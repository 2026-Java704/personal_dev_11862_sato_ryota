<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header th:replace="~{header}"></header>
	<main>
		<div>
			<h1>
				服薬一覧
			</h1>
			<span name="name" th:value="${@account.userName}" th:text="${@account.userName}"></span>
		</div>
		<div>
			<table border="1">
				<tr>
					<th>No</th>
					<th>薬の名前</th>
					<th>服薬個数</th>
					<th>服薬したか</th>
					<th>備考</th>
					<th>更新</th>
					<th>削除</th>
				</tr>
				<tr>
					<td>1</td>
					<td>name</td>
					<td>3(具体的な個数をDBからもってくる)</td>
					<td>
						<form action="" method="">
							<input type="checkbox" name="check">チェック
						</form>
					</td>
					<td>備考テキスト</td>
					<td>
						<form action="" method="get">
							<input type="button" name="kousin" value="更新">
						</form>
					</td>
					<td>
						<form action="" method="get">
							<input type="button" name="kousin" value="削除">
						</form>
					</td>
				</tr>
				<tr>
					<td>2</td>
					<td>name</td>
					<td>3(具体的な個数をDBからもってくる)</td>
					<td>
						<form action="" method="">
							<input type="checkbox" name="check">チェック
						</form>
					</td>
					<td>備考テキスト</td>
					<td>
						<form action="" method="get">
							<input type="button" name="kousin" value="更新">
						</form>
					</td>
					<td>
						<form action="" method="get">
							<input type="button" name="kousin" value="削除">
						</form>
					</td>
				</tr>
			</table>
			<form action="" method="get">
				<button>
					新しく薬を登録する
				</button>
			</form>
		</div>
	</main>
	<footer th:replace="~{footer}"></footer>
</body>
</html>
