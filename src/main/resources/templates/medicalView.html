<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
<script src="script.js"></script>
</head>
<body>
	<header th:replace="~{header}"></header>
	<div class="wrapper">
		<main>
			<div class="login">
				<p>
					<a class="home_title" href="/medicalView">服薬一覧</a>
					<br>
					<span class="account_title" name="name" th:value="${@account.userName}" th:text="|ログインユーザー : ${@account.userName}|"></span>
					<br>
					<!--	薬の服用履歴を確認できる画面を作成する-->
					<input type="hidden" name="id" th:value="${@account.userName}">
					<span th:text="${updateMessege}"></span>
				</p>
			</div>
			<table class="table_view">
				<tr>
					<th class="th_tag table_title">薬の名前</th>
					<th class="th_tag table_title">個数</th>
					<th class="th_tag table_title">残り在庫</th>
					<th class="th_check table_title">チェック</th>
					<th class="th_tag table_title">編集</th>
					<th class="th_overview table_title">備考</th>
				</tr>
				<tr  th:each="medicine : ${medicineList}">
					<td  class="th_tag" th:text="${medicine.name}"></td>
					<td  class="th_tag" th:text="${medicine.count}"></td>
					<td  class="th_tag" th:text="${medicine.remainingMedicineNumber}"></td>
					<td  class="th_tag">
						<form action="/check" id="autoForm" method="post">
							<input type="hidden" name="id" th:value="${medicine.id}">
<!--							onchange="document.getElementById('autoForm').submit()"-->
							<input type="checkbox" th:id="|ap_id-${medicine.id}|" name="check" th:checked="${medicine.check}" onchange="this.form.submit()" />
<!--							onchange="submitParentForm(event)"-->
							<label th:for="|ap_id-${medicine.id}|" class="label" th:text="${medicine.check} ? 完了 : 未完了">check</label>
						</form>
					</td>
					<td  class="th_tag">
						<form action="/updateView" method="post">
							<input type="hidden" name="update" th:value="${medicine.id}">
							<button class="button_cs">選択</button>
						</form>
					</td>
					<td  class="th_overview" th:text="${medicine.text}"></td>
				</tr>
				<tr>
					<td></td>
					<td></td>
					<td></td>
					<td></td>
					<td></td>
					<td>
						<a href="/insertMedicineView">くすり新規登録</a>
					</td>
				</tr>
				<tr>
					<td></td>
					<td></td>
					<td></td>
					<td></td>
					<td></td>
					<td>
						<a href="/historyMedicine">服薬履歴を表示</a>
					</td>
				</tr>
			</table>
		</main>
		<footer th:replace="~{footer}"></footer>
	</div>
</body>
</html>
