<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ユーザー登録</title>
<!--	cssファイルはstaticフォルダ直下におかないといけない。-->
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header th:replace="~{header}"></header>
	<main>
		<div>
			<h1>
				新規登録画面
			</h1>
		</div>
		<div>
			<form action="/medicalView" method="post">
				<input type="text" name="name">
				<br>
				<input type="password" name="password">
				<button>
					ユーザーを登録する
				</button>
			</form>
		</div>
		<!--   繰り返しエラーリストを出力する。  -->
		<div th:replace="~{error}"></divth:replace="~{footer}">
	</main>
	<footer th:replace="~{footer}"></footer>
</body>
</html>
