<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ユーザー登録</title>
<!--	cssファイルはstaticフォルダ直下におかないといけない。-->
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
</head>
<body>
	<header>
		<span class="header_title">お薬チェックくん</span>
	</header>
	<div class="wrapper">
		<main style="text-align: center;">
			<div>
				<h1>
					新規登録画面
				</h1>
			</div>
			<div>
				<form action="/medicalView" method="post">
					ユーザー名 : <input type="text" name="name" class="textbox-2">
					<br>
					<br>
					パスワード : <input type="password" name="password" class="textbox-2">
					<br>
					<br>
					<button  class="button_createUser">
						ユーザーを登録する
					</button>
				</form>
				<br>
				<br>
				<hr>
				<br>
				<a href="/">ログイン画面に戻る</a>
			</div>
			<!--   繰り返しエラーリストを出力する。  -->
			<div th:replace="~{error}"></div>
		</main>
		<footer th:replace="~{footer}"></footer>
	</div>
</body>
</html>
