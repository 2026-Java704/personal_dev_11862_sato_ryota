<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>test</title>
<!--	inputタグの特定の属性にのみスタイルを適用する、属性セレクタ[type=checkbox]を使用-->
 <style>
	/*  参考  https://proengineer.internous.co.jp/content/columnfeature/6493 */
		input[type=checkbox] { display: none; /* チェックボックスを非表示にする */ }
		input[type="checkbox"]:checked + label { 
			background: #31A9EE;/* マウス選択時の背景色を指定する */ 
			color: #ffffff; /* マウス選択時のフォント色を指定する */
		}
		
		.label {
			margin: 10px; /* ラベル外側の余白を指定する */
			border: 2px solid #006DD9;/* ラベルの境界線を実線で指定する */ 
			display: block;
			width: 150px; /* ラベルの横幅を指定する */
			height: 45px; /* ラベルの高さを指定する */
			padding-left: 5px; /* ラベル内左側の余白を指定する */
			padding-right: 5px; /* ラベル内右側の余白を指定する */
			cursor: pointer; /* マウスカーソルの形（リンクカーソル）を指定する */
			color: #b20000; /* フォントの色を指定 */
			border-radius: 5px; /* 角丸を指定する */
		}
		.label:hover { background-color: #E2EDF9; /* マウスオーバー時の背景色を指定する */ }
</style>
</head>
<body>
	<form action="/" method="get">
<!--		inputタグのid属性名と、labelタグのfor属性名は同じにする必要がある-->
		<input type="checkbox" name="check" id="ap_id">
		<label for="ap_id" class="label">チェックボックス</label>
		<button>完了</button>
	</form>
</body>
</html>
