<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ログイン</title>
<!--	cssファイルはstaticフォルダ直下におかないといけない。-->
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header th:replace="~{header}"></header>
	<div class="login">
		<form action="/loginCheck" method="post">
			<p  class="formLogin">
				ログイン画面
			</p>
			<p>
				<div class="formUser1">
					ユーザー名 : <input type="text" name="name">
				</div>
				<br>
				<div class="formUser2">
					パスワード : <input type="password" name="password">
				</div>
				<br>
				<button class="formButton">ログイン</button>
				<hr>
				<br>
				<form action="/createUser" method="get">
					アカウントがない場合...<button>新規登録</button>
				</form>
				<!--   繰り返しエラーリストを出力する。  -->
				<div th:replace="~{error}"></div>
			</p>
		</form>
		<br>
	</div>
	
	</main>
	<footer th:replace="~{footer}"></footer>
</body>
</html>
